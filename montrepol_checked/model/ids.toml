# model/ids.toml --- the conformance ID register.
#
# Every claim with a test, in one place. CONFORMANCE.md is generated from
# this file (R1). Each ID must be tagged on at least one test in its package,
# and every test tag must be an ID here (R3). Levels (R2):
#
#   some-true  reproduced from an authority; not established here
#   build      constructed here and checked against an oracle; evidence, not proof
#
# An ID is never `open`: it has a test, and a test asserts.

spec = "montrepol/1"

[[id]]
id = "CK-01"
package = "mp-check"
level = "build"
claim = "integerIn lo hi yields values in the closed interval [lo, hi]."
oracle = "200 generated intervals and draws."

[[id]]
id = "CK-02"
package = "mp-check"
level = "build"
claim = "The property runner reports a property that fails on one value in ten, and accepts a true one."
oracle = "x /= 7 over [0, 9], 200 cases."

[[id]]
id = "CK-03"
package = "mp-check"
level = "build"
claim = "integerIn reaches every value of a small range."
oracle = "400 draws from [0, 9]."

[[id]]
id = "CK-04"
package = "mp-check"
level = "build"
claim = "The SplitMix64 stream matches the published algorithm."
oracle = "First three outputs for seed 0 from an independent C implementation."
authorities = ["steele-2014"]

[[id]]
id = "LA-01"
package = "mp-linalg"
level = "build"
