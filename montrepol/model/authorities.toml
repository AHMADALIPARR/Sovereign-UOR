# model/authorities.toml --- sources this repository reproduces facts from.
#
# Every entry must be cited by at least one ID or ledger row (R2), and every
# citation must name an entry here.

[[authority]]
key = "steele-2014"
cite = "G. L. Steele, D. Lea, C. H. Flood. Fast splittable pseudorandom number generators. OOPSLA 2014. (SplitMix64; constants as in Java's SplittableRandom.)"

[[authority]]
key = "strassen-1969"
cite = "V. Strassen. Gaussian elimination is not optimal. Numerische Mathematik 13 (1969) 354-356."

[[authority]]
key = "bareiss-1968"
cite = "E. H. Bareiss. Sylvester's identity and multistep integer-preserving Gaussian elimination. Mathematics of Computation 22 (1968) 565-578."

[[authority]]
key = "kish-1965"
cite = "L. Kish. Survey Sampling. Wiley, 1965. (Effective sample size.)"

[[authority]]
key = "humphreys-1990"
cite = "J. E. Humphreys. Reflection Groups and Coxeter Groups. Cambridge University Press, 1990. Sections 2.10-2.11 and 3.7 (orders and degrees)."

[[authority]]
key = "bourbaki-lie-4-6"
cite = "N. Bourbaki. Lie Groups and Lie Algebras, Chapters 4-6. Springer, 2002. Plates I-IX (root counts, Cartan matrices)."

[[authority]]
key = "massey-1969"
