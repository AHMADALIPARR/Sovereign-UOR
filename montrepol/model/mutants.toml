# SPDX-License-Identifier: AGPL-3.0-or-later
# model/mutants.toml --- planted defects, and the tests that must catch them.
#
# A gate that cannot fail reads as evidence, so every piece of mathematics
# here has at least one defect planted in it and the tests named in `expect`
# must fail when it is. `cabal run mp-gate -- mutants` applies each one in
# turn, runs that package's tests, and restores the file. A mutant counts as
# caught only when a named test fails: a mutant that merely stops the build
# (an unused binding under -Werror, say) is reported as not caught.

[[mutant]]
name = "Strassen: wrong product in C22"
package = "mp-linalg"
file = "packages/mp-linalg/src/MP/Matrix.hs"
old = "c22 = ((m1 -: m2) +: m3) +: m6"
new = "c22 = ((m1 -: m2) +: m3) -: m6"
expect = ["LA-03"]

[[mutant]]
name = "Bareiss: row swap without sign flip"
package = "mp-linalg"
file = "packages/mp-linalg/src/MP/Matrix.hs"
old = "sign' = if swapped then neg sign else sign"
new = "sign' = if swapped then sign else sign"
expect = ["LA-04"]

[[mutant]]
name = "Kish: 64-bit saturation reintroduced"
package = "mp-linalg"
file = "packages/mp-linalg/src/MP/Participation.hs"
old = "Just (fromIntegral (s * s) / fromIntegral sq)"
new = "Just (fromIntegral (min (s * s) (2 ^ (64 :: Int) - 1)) / fromIntegral (min sq (2 ^ (64 :: Int) - 1)))"
expect = ["LA-08"]

[[mutant]]
name = "Weyl orbit: only reflect on positive coordinates"
package = "mp-lie"
file = "packages/mp-lie/src/MP/RootSystem.hs"
old = "(li, row) <- zip l c, li /= 0]"
new = "(li, row) <- zip l c, li > 0, li /= 1]"
expect = ["LI-04"]

[[mutant]]
name = "Root axioms: closure check disabled"
package = "mp-lie"
file = "packages/mp-lie/src/MP/RootSystem.hs"
old = "not (Set.member r set)"
new = "False && not (Set.member r set)"
expect = ["LI-01"]

[[mutant]]
name = "Berlekamp-Massey: length update off by one"
package = "mp-seq"
file = "packages/mp-seq/src/MP/Recurrence.hs"
old = "if 2 * l <= k"
new = "if 2 * l < k"
expect = ["SQ-01", "SQ-02"]

[[mutant]]
name = "Sieve: crosses off with stride 2i"
package = "mp-analytic"
file = "packages/mp-analytic/src/MP/Primes.hs"
old = "[i * i, i * i + i .. n]"
new = "[i * i, i * i + 2 * i .. n]"
expect = ["AN-01"]

[[mutant]]
name = "Euler-Maclaurin: N^-s/2 term dropped"
package = "mp-analytic"
file = "packages/mp-analytic/src/MP/Zeta.hs"
old = "direct + tailTerm + half + corrections"
new = "direct + tailTerm - half + corrections"
expect = ["AN-04"]

[[mutant]]
name = "theta: -pi/8 dropped"
package = "mp-analytic"
file = "packages/mp-analytic/src/MP/Zeta.hs"
old = "t / 2 * log (t / (2 * pi)) - t / 2 - pi / 8"
new = "t / 2 * log (t / (2 * pi)) - t / 2"
expect = ["AN-05"]

[[mutant]]
name = "Bernoulli: recurrence index shifted"
package = "mp-analytic"
file = "packages/mp-analytic/src/MP/Bernoulli.hs"
old = "k <- [0 .. m - 1]]"
new = "k <- [1 .. m - 1]]"
expect = ["AN-03"]

[[mutant]]
name = "Gate: R5 partial-function list emptied"
package = "mp-gate"
file = "packages/mp-gate/src/MP/Gate/Scan.hs"
old = "partialNames =\n  [ \"err\" <> \"or\""
new = "partialNames = drop 99\n  [ \"err\" <> \"or\""
expect = ["GT-05"]

[[mutant]]
name = "Gate: R3 untested-ID check disabled"
package = "mp-gate"
file = "packages/mp-gate/src/MP/Gate/Rules.hs"
old = ", rowId r `notElem` tagsIn (rowPackage r)"
new = ", rowId r `notElem` tagsIn (rowPackage r), False"
expect = ["GT-03"]

[[mutant]]
name = "Harness: property runner stops after case 0"
package = "mp-check"
file = "packages/mp-check/src/MP/Check.hs"
old = "Result [] -> go (c + 1) s2"
new = "Result [] -> if c >= 0 then Nothing else go (c + 1) s2"
expect = ["CK-02"]

[[mutant]]
name = "Gate: SPDX header check disabled"
package = "mp-gate"
file = "packages/mp-gate/src/MP/Gate/Rules.hs"
old = ", take 1 (lines (sourceText f)) /= [spdxHeader]"
new = ", take 1 (lines (sourceText f)) /= [spdxHeader], False"
expect = ["GT-06"]

[[mutant]]
name = "Proof: Strassen C12 stated with the wrong product"
package = "formal"
file = "formal/Montrepol/Strassen.agda"
old = "strassen-c12 : M₃ + M₅ ≡ a₁₁ * b₁₂ + a₁₂ * b₂₂"
new = "strassen-c12 : M₃ + M₅ ≡ a₁₁ * b₁₂ + a₁₂ * b₁₂"
expect = ["Strassen.agda"]

[[mutant]]
name = "Proof: M6 defined with b22 in place of b12"
package = "formal"
file = "formal/Montrepol/Strassen.agda"
old = "M₆ = (a₂₁ - a₁₁) * (b₁₁ + b₁₂)"
new = "M₆ = (a₂₁ - a₁₁) * (b₁₁ + b₂₂)"
expect = ["Strassen.agda"]

[[mutant]]
name = "Proof: normaliser forgets to swap signs under negation"
package = "formal"
file = "formal/Montrepol/Solver.agda"
old = "norm (⊝ e)    = snd (norm e) , fst (norm e)"
new = "norm (⊝ e)    = fst (norm e) , snd (norm e)"
expect = ["Solver.agda"]

[[mutant]]
name = "Proof: Kish bound reversed"
package = "formal"
file = "formal/Montrepol/Kish.agda"
old = "kish-lower : ∀ ws → sumSq ws ≤ sum ws * sum ws"
new = "kish-lower : ∀ ws → sum ws * sum ws ≤ sumSq ws"
expect = ["Kish.agda"]

[[mutant]]
name = "Gate: proved-claim lemma check disabled"
package = "mp-gate"
file = "packages/mp-gate/src/MP/Gate/Rules.hs"
old = ", not (any ((n <> \" :\") `isPrefixOf`) (map (dropWhile isSpace) (lines (sourceText f))))"
new = ", False && not (any ((n <> \" :\") `isPrefixOf`) (map (dropWhile isSpace) (lines (sourceText f))))"
expect = ["GT-08"]

[[mutant]]
name = "Hcalc: refutation checker accepts anything"
package = "mp-hcalc"
file = "packages/mp-hcalc/src/MP/Hcalc/Sat.hs"
old = "checkRefutation cs r = derive r == Just []"
new = "checkRefutation cs r = derive r == Just [] || True"
expect = ["HC-02"]

[[mutant]]
name = "Hcalc: Fourier-Motzkin drops strictness"
package = "mp-hcalc"
file = "packages/mp-hcalc/src/MP/Hcalc/Linear.hs"
old = "(if rel kp == Lt || rel kn == Lt then Lt else Le)"
new = "(if rel kp == Lt && rel kn == Lt then Lt else Le)"
expect = ["HC-03"]

[[mutant]]
name = "Hcalc: back-substitution takes a strict bound itself"
package = "mp-hcalc"
file = "packages/mp-hcalc/src/MP/Hcalc/Linear.hs"
old = "(Just (l, r), Nothing) -> if r == Le then l else l + 1"
new = "(Just (l, r), Nothing) -> if r == Le then l else l"
expect = ["HC-03"]

[[mutant]]
name = "Hcalc: Farkas checker allows negative multipliers"
package = "mp-hcalc"
file = "packages/mp-hcalc/src/MP/Hcalc/Linear.hs"
old = "  all (>= 0) (Map.elems lam)\n"
new = "  all (>= (-1000)) (Map.elems lam)\n"
expect = ["HC-04"]

[[mutant]]
name = "Hcalc: negating e <= 0 gives -e <= 0"
package = "mp-hcalc"
file = "packages/mp-hcalc/src/MP/Hcalc/Smt.hs"
old = "(if rel k == Le then Lt else Le)"
new = "(if rel k == Le then Le else Lt)"
expect = ["HC-05"]

[[mutant]]
name = "Hcalc: Tseitin OR gate missing its upward clauses"
package = "mp-hcalc"
file = "packages/mp-hcalc/src/MP/Hcalc/Smt.hs"
old = "    mapM_ (\\l -> emit [g, negate l]) ls\n"
new = "    mapM_ (\\l -> emit [g, negate l]) (take 0 ls)\n"
expect = ["HC-07"]

[[mutant]]
name = "Lambda: substitution under a binder forgets to shift"
package = "mp-lambda"
file = "packages/mp-lambda/src/MP/Lambda/Simple.hs"
old = "Lam a body -> Lam a (subst (j + 1) (shift 1 0 s) body)"
new = "Lam a body -> Lam a (subst (j + 1) s body)"
expect = ["LM-05"]

[[mutant]]
name = "Refine: subtyping between integers always succeeds"
package = "mp-lambda"
file = "packages/mp-lambda/src/MP/Lambda/Refine.hs"
old = "subtype env (RInt v p) (RInt w q) =\n  valid'"
new = "subtype env (RInt v p) (RInt w q) =\n  const (Right ()) $ valid'"
expect = ["LM-08"]

[[mutant]]
name = "Refine: substitution into types captures"
package = "mp-lambda"
file = "packages/mp-lambda/src/MP/Lambda/Refine.hs"
old = "    | z == y -> let z' = freshFrom z t in RFun z' (substType x y a) (substType x y (substType z z' b))\n"
new = "    | z == y && False -> let z' = freshFrom z t in RFun z' (substType x y a) (substType x y (substType z z' b))\n"
expect = ["LM-09"]

[[mutant]]
name = "Liquid: size of a variable claimed 0"
package = "liquid"
file = "packages/mp-lambda/src/MP/Lambda/Simple.hs"
old = "  _ -> 1\n"
new = "  _ -> 0\n"
expect = ["Simple.hs"]

[[mutant]]
name = "Liquid: typeOf recurses on the whole term under a lambda"
package = "liquid"
file = "packages/mp-lambda/src/MP/Lambda/Simple.hs"
old = "  Lam a body -> TArr a <$> typeOf (a : ctx) body"
new = "  Lam a body -> TArr a <$> typeOf (a : ctx) (if size body > 0 then t else body)"
expect = ["Simple.hs"]

[[mutant]]
name = "Liquid: evaluate keeps stepping when the fuel is spent"
package = "liquid"
file = "packages/mp-lambda/src/MP/Lambda/Simple.hs"
old = "  | fuel <= 0 = Nothing\n"
new = "  | fuel < 0 = Nothing\n"
expect = ["Simple.hs"]

[[mutant]]
name = "Dex: Strassen C22 with M6 subtracted"
package = "dex"
file = "dex/Montrepol.dx"
old = "[[m1 + m4 - m5 + m7, m3 + m5], [m2 + m4, m1 - m2 + m3 + m6]]"
new = "[[m1 + m4 - m5 + m7, m3 + m5], [m2 + m4, m1 - m2 + m3 - m6]]"
expect = ["> True"]

[[mutant]]
name = "Dex: product adds a stray term"
package = "dex"
file = "dex/Montrepol.dx"
old = "  for i l. sum for j:m. x[i,j] * y[j,l]"
new = "  for i l. sum for j:m. x[i,j] * y[j,l] + x[i,j]"
expect = ["> True"]

[[mutant]]
name = "Dex: Kish comparison made strict"
package = "dex"
file = "dex/Montrepol.dx"
old = "  (total * total) >= (k * squares)"
new = "  (total * total) > (k * squares)"
expect = ["> True"]
