# model/mutants.toml --- planted defects, and the tests that must catch them.
#
# A gate that cannot fail reads as evidence, so every piece of mathematics
# here has at least one defect planted in it and the tests named in `expect`
# must fail when it is. `cabal run mp-gate -- mutants` applies each one in
# turn, runs that package's tests, and restores the file. A mutant counts as
# caught only when a named test fails: a mutant that merely stops the build
# (an unused binding under -Werror, say) is reported as not caught.

[[mutant]]
name = "Strassen: wrong product in C22"
package = "mp-linalg"
file = "packages/mp-linalg/src/MP/Matrix.hs"
old = "c22 = ((m1 -: m2) +: m3) +: m6"
new = "c22 = ((m1 -: m2) +: m3) -: m6"
expect = ["LA-03"]

[[mutant]]
name = "Bareiss: row swap without sign flip"
package = "mp-linalg"
file = "packages/mp-linalg/src/MP/Matrix.hs"
old = "sign' = if swapped then neg sign else sign"
new = "sign' = if swapped then sign else sign"
expect = ["LA-04"]

[[mutant]]
name = "Kish: 64-bit saturation reintroduced"
package = "mp-linalg"
file = "packages/mp-linalg/src/MP/Participation.hs"
old = "Just (fromIntegral (s * s) / fromIntegral sq)"
new = "Just (fromIntegral (min (s * s) (2 ^ (64 :: Int) - 1)) / fromIntegral (min sq (2 ^ (64 :: Int) - 1)))"
expect = ["LA-08"]

[[mutant]]
name = "Weyl orbit: only reflect on positive coordinates"
package = "mp-lie"
file = "packages/mp-lie/src/MP/RootSystem.hs"
old = "(li, row) <- zip l c, li /= 0]"
new = "(li, row) <- zip l c, li > 0, li /= 1]"
expect = ["LI-04"]

[[mutant]]
name = "Root axioms: closure check disabled"
package = "mp-lie"
file = "packages/mp-lie/src/MP/RootSystem.hs"
old = "not (Set.member r set)"
new = "False && not (Set.member r set)"
expect = ["LI-01"]

[[mutant]]
name = "Berlekamp-Massey: length update off by one"
package = "mp-seq"
file = "packages/mp-seq/src/MP/Recurrence.hs"
old = "if 2 * l <= k"
new = "if 2 * l < k"
expect = ["SQ-01", "SQ-02"]

[[mutant]]
name = "Sieve: crosses off with stride 2i"
package = "mp-analytic"
file = "packages/mp-analytic/src/MP/Primes.hs"
old = "[i * i, i * i + i .. n]"
new = "[i * i, i * i + 2 * i .. n]"
expect = ["AN-01"]

[[mutant]]
name = "Euler-Maclaurin: N^-s/2 term dropped"
package = "mp-analytic"
file = "packages/mp-analytic/src/MP/Zeta.hs"
old = "direct + tailTerm + half + corrections"
new = "direct + tailTerm - half + corrections"
expect = ["AN-04"]

[[mutant]]
name = "theta: -pi/8 dropped"
package = "mp-analytic"
file = "packages/mp-analytic/src/MP/Zeta.hs"
old = "t / 2 * log (t / (2 * pi)) - t / 2 - pi / 8"
new = "t / 2 * log (t / (2 * pi)) - t / 2"
expect = ["AN-05"]

[[mutant]]
name = "Bernoulli: recurrence index shifted"
package = "mp-analytic"
file = "packages/mp-analytic/src/MP/Bernoulli.hs"
old = "k <- [0 .. m - 1]]"
new = "k <- [1 .. m - 1]]"
expect = ["AN-03"]

[[mutant]]
name = "Gate: R5 partial-function list emptied"
package = "mp-gate"
file = "packages/mp-gate/src/MP/Gate/Scan.hs"
old = "partialNames =\n  [ \"err\" <> \"or\""
new = "partialNames = drop 99\n  [ \"err\" <> \"or\""
expect = ["GT-05"]

[[mutant]]
name = "Gate: R3 untested-ID check disabled"
package = "mp-gate"
file = "packages/mp-gate/src/MP/Gate/Rules.hs"
old = ", rowId r `notElem` tagsIn (rowPackage r)"
new = ", rowId r `notElem` tagsIn (rowPackage r), False"
expect = ["GT-03"]

[[mutant]]
name = "Harness: property runner stops after case 0"
package = "mp-check"
file = "packages/mp-check/src/MP/Check.hs"
old = "Result [] -> go (c + 1) s2"
new = "Result [] -> if c >= 0 then Nothing else go (c + 1) s2"
expect = ["CK-02"]
