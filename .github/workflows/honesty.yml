# Falsifiability: every planted defect in montrepol/model/mutants.toml must be
# caught by the tests it names. Split from `ci` so a failure here reads as "a
# test can no longer fail", not "the code is broken".
# Follows montrepol/.github/workflows/honesty.yml, run from montrepol/.
# The version before montrepol_checked is kept in
# docs/workflows-original/honesty.yml.txt.
name: honesty

on:
  push:
    branches: [main]
    # Docs-only pushes were stacking 360-minute mutant jobs (runs 73-76).
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/*.png"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/*.png"
  workflow_dispatch:

# Same reason as ci.yml: do not key concurrency on the branch name, or a
# delayed older SHA can cancel the tip. honesty previously had no
# concurrency at all, so five mutant jobs ran at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: Latest commit only
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.check.outputs.continue }}
    steps:
      - id: check
        name: Compare this SHA to the branch tip
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(git ls-remote --heads "https://github.com/${{ github.repository }}.git" "${{ github.ref_name }}" | awk '{print $1}')
          echo "branch tip: $tip"
          echo "this sha:   ${{ github.sha }}"
          if [ "$tip" = "${{ github.sha }}" ]; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
          else
            echo "This run is for an older commit; skipping the rest."
            echo "continue=false" >> "$GITHUB_OUTPUT"
          fi

  mutants:
    name: Mutant replay (montrepol)
    needs: [gate]
    if: needs.gate.outputs.continue == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: montrepol
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.10.1"
          cabal-version: "3.12.1.0"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            montrepol/dist-newstyle
          key: ${{ runner.os }}-ghc-9.10.1-montrepol-${{ hashFiles('montrepol/cabal.project', 'montrepol/packages/*/*.cabal') }}
      # Proof mutants are replayed with Agda, refinement mutants with Liquid
      # Haskell and Z3; the liquid layer resolves against Hackage.
      - run: sudo apt-get update && sudo apt-get install -y agda-bin z3
      # Headers dex-lang needs to build its runtime (dexrt.cpp includes png.h).
      - run: sudo apt-get install -y libpng-dev libgmp-dev zlib1g-dev libtinfo-dev libnuma-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: montrepol/liquid/dist-newstyle
          key: ${{ runner.os }}-liquid-${{ hashFiles('montrepol/liquid/cabal.project', 'montrepol/liquid/*.cabal') }}
      - run: cabal update
      # Dex mutants are replayed with the pinned Dex toolchain. build.sh is run
      # with bash because it is committed without the executable bit.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            montrepol/dex/.toolchain
          key: ${{ runner.os }}-dex-${{ hashFiles('montrepol/dex/build.sh') }}
      - run: bash dex/build.sh
      - run: cabal build all
      - run: cabal run mp-gate -- mutants
      # The mutant run restores every file it touches; prove the tree is clean.
      - run: git diff --exit-code
