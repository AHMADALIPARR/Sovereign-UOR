name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCALA_VERSION: 3.5.2

jobs:
  # ------------------------------------------------------------------
  # Fast path: compile kernel + run pure-Scala unit tests
  # ------------------------------------------------------------------
  test:
    name: Compile & Test (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install scala-cli
        run: |
          curl -fsSL https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz \
            | gunzip > /usr/local/bin/scala-cli
          chmod +x /usr/local/bin/scala-cli
          scala-cli version

      - name: Compile sources
        run: |
          scala-cli compile \
            --scala ${{ env.SCALA_VERSION }} \
            src/main/scala/uor/kernel/U64.scala \
            src/main/scala/uor/kernel/Poly64.scala \
            src/main/scala/uor/ffi/UorExports.scala

      - name: Run unit tests (munit)
        run: |
          scala-cli test \
            --scala ${{ env.SCALA_VERSION }} \
            --test-only uor.kernel.Poly64Test \
            src/main/scala/uor/kernel \
            src/test/scala/uor/kernel/Poly64Test.scala

  # ------------------------------------------------------------------
  # Native Image shared library (GraalVM)
  # ------------------------------------------------------------------
  native-image:
    name: Native Image (shared lib)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM + native-image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
          cache: 'native-image'

      - name: Install scala-cli
        run: |
          curl -fsSL https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz \
            | gunzip > /usr/local/bin/scala-cli
          chmod +x /usr/local/bin/scala-cli

      - name: Compile to class files
        run: |
          mkdir -p build
          scala-cli --power compile \
            --scala ${{ env.SCALA_VERSION }} \
            --server=false \
            -d build \
            src/main/scala/uor/kernel/U64.scala \
            src/main/scala/uor/kernel/Poly64.scala \
            src/main/scala/uor/ffi/UorExports.scala
          echo "=== Class files ==="
          find build -name '*.class' | head -30

      - name: Build shared library with native-image
        run: |
          native-image --shared \
            -cp build \
            -H:Name=libuor \
            -O2 \
            --no-fallback \
            -H:+ReportExceptionStackTraces \
            --initialize-at-build-time=uor \
            --initialize-at-build-time=scala.runtime \
            --initialize-at-build-time=java.lang \
            --initialize-at-run-time=java.security.SecureRandom \
            -H:Log=registerResource: \
            -H:+AllowIncompleteClasspath

      - name: Verify artifacts & symbols
        run: |
          echo "=== Artifacts ==="
          ls -lh libuor* graal_isolate* 2>/dev/null || true
          file libuor.so
          echo "=== Exported UOR symbols ==="
          nm -D --defined-only libuor.so 2>/dev/null | grep -E 'uor_' || echo "(nm symbols not listed – still ok if .so exists)"

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libuor-linux-x86_64
          path: |
            libuor.so
            libuor.h
            graal_isolate*.h
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------
  # Final status gate
  # ------------------------------------------------------------------
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test, native-image]
    if: always()
    steps:
      - name: Aggregate results
        run: |
          echo "Test job      → ${{ needs.test.result }}"
          echo "Native Image  → ${{ needs.native-image.result }}"
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ JVM compile / unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.native-image.result }}" != "success" ]]; then
            echo "❌ Native Image shared-library build failed"
            exit 1
          fi
          echo "✅ All CI jobs passed"
