name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Fast path: compile kernel + run pure-Scala unit tests
  # ------------------------------------------------------------------
  test:
    name: Compile & Test (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt          # harmless even if we don't use sbt

      - name: Install scala-cli
        run: |
          curl -sS -L https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz \
            | gunzip > /usr/local/bin/scala-cli
          chmod +x /usr/local/bin/scala-cli
          scala-cli version

      - name: Compile sources
        run: |
          scala-cli compile \
            src/main/scala/uor/kernel/U64.scala \
            src/main/scala/uor/kernel/Poly64.scala \
            src/main/scala/uor/ffi/UorExports.scala

      - name: Run unit tests
        run: |
          scala-cli test \
            --test-only uor.kernel.Poly64Test \
            src/main/scala/uor/kernel \
            src/test/scala/uor/kernel/Poly64Test.scala

  # ------------------------------------------------------------------
  # Native Image shared library (GraalVM)
  # ------------------------------------------------------------------
  native-image:
    name: Native Image (shared lib)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test          # only run if tests passed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 21
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: true
          cache: native-image

      - name: Install scala-cli
        run: |
          curl -sS -L https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz \
            | gunzip > /usr/local/bin/scala-cli
          chmod +x /usr/local/bin/scala-cli

      - name: Compile to class files
        run: |
          mkdir -p build
          scala-cli --power compile \
            --server=false \
            -d build \
            src/main/scala/uor/kernel/U64.scala \
            src/main/scala/uor/kernel/Poly64.scala \
            src/main/scala/uor/ffi/UorExports.scala

      - name: Build shared library with native-image
        run: |
          native-image --shared \
            -cp build \
            -H:Name=libuor \
            -O3 \
            --no-fallback \
            --enable-url-protocols=https \
            -H:+ReportExceptionStackTraces \
            -H:ReflectionConfigurationFiles= \
            --initialize-at-build-time=uor \
            --initialize-at-build-time=scala \
            --initialize-at-build-time=java.security \
            -H:IncludeResources=.*

      - name: Verify artifacts
        run: |
          ls -lh libuor.so libuor.h || ls -lh *.so *.h
          file libuor.so || file *.so
          # quick smoke: the shared object must export the entry points
          nm -D libuor.so 2>/dev/null | grep -E 'uor_(d64_transform_inplace|strata_histogram|poly64_canonicalize)' || true

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libuor-linux-x86_64
          path: |
            libuor.so
            libuor.h
            graal_isolate*.h
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------
  # Status summary (always runs)
  # ------------------------------------------------------------------
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test, native-image]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Test job: ${{ needs.test.result }}"
          echo "Native Image job: ${{ needs.native-image.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Unit tests / compilation failed"
            exit 1
          fi
          if [ "${{ needs.native-image.result }}" != "success" ]; then
            echo "❌ Native Image build failed"
            exit 1
          fi
          echo "✅ All CI jobs passed"
